{{- if .Values.opentelemetryCollector.enabled }}
{{- include "values-secret" (dict "root" $ "package" .Values.opentelemetryCollector.values "name" "opentelemetry-collector" "defaults" (include "opsc.defaults.opentelemetryCollector" .)) }}
{{- end }}

{{- /*
  The gateway's configuration, built from opentelemetryCollector.destinations.

  Each signal gets a pipeline only if at least one enabled destination takes
  that signal. A pipeline with no destination is set to null, which removes
  the chart's default pipeline of the same name rather than leaving it
  exporting to `debug`.

  Elasticsearch takes metrics through its own pipeline, metrics/elasticsearch,
  because Elastic's OTel-native mapping stores only DELTA histograms and the
  exporter drops cumulative ones. cumulativetodelta converts histograms, and
  only histograms, on that pipeline, so every other destination keeps the
  cumulative series it expects. cumulativetodelta is stateful per series,
  which is why the gateway runs one replica.
*/ -}}
{{- define "opsc.defaults.opentelemetryCollector" -}}
{{- $c := .Values.opentelemetryCollector -}}
{{- $d := $c.destinations -}}
{{- $esStack := .Values.elasticStack -}}
{{- $esOn := $d.elasticsearch.enabled -}}
{{- $apmOn := $d.apmServer.enabled -}}
{{- if and $esOn (not $esStack.enabled) }}
{{- fail "opentelemetryCollector.destinations.elasticsearch needs elasticStack.enabled: it writes to the Elasticsearch that elasticStack deploys" }}
{{- end }}
{{- if and $apmOn (not (and $esStack.enabled $esStack.apmServer.enabled)) }}
{{- fail "opentelemetryCollector.destinations.apmServer needs elasticStack.enabled and elasticStack.apmServer.enabled" }}
{{- end }}
{{- if and $apmOn (not $esStack.apmServer.disableTls) }}
{{- fail "opentelemetryCollector.destinations.apmServer supports elasticStack.apmServer.disableTls: true only; verifying APM Server's own CA is not wired yet" }}
{{- end }}
{{- $esNs := $esStack.namespace | default "elastic-stack" -}}
{{- $esName := $esStack.elasticsearch.name | default "elasticsearch" -}}
{{- $esTls := not $esStack.elasticsearch.disableTls -}}
{{- $pipes := dict "traces" (list) "metrics" (list) "logs" (list) -}}
{{- if $apmOn }}
{{- range $d.apmServer.signals }}{{- $_ := set $pipes . (append (get $pipes .) "otlp/apm-server") }}{{- end }}
{{- end }}
{{- range $d.otlp }}
{{- $exp := printf "%s/%s" (ternary "otlphttp" "otlp" (eq .protocol "http")) .name }}
{{- range .signals }}{{- $_ := set $pipes . (append (get $pipes .) $exp) }}{{- end }}
{{- end }}
{{- $esSignals := ternary $d.elasticsearch.signals (list) $esOn -}}
{{- $any := or (gt (len $esSignals) 0) (gt (len (get $pipes "traces")) 0) (gt (len (get $pipes "metrics")) 0) (gt (len (get $pipes "logs")) 0) -}}
{{- if not $any }}
{{- fail "opentelemetryCollector is enabled with no destination: enable destinations.elasticsearch or destinations.apmServer, or add an entry to destinations.otlp" }}
{{- end }}
# OpenTelemetry Collector gateway, rendered by opsc from opentelemetryCollector.destinations.
fullnameOverride: otel-gateway
mode: deployment
replicaCount: 1
image:
  repository: {{ $c.image.repository }}
  tag: {{ $c.image.tag | quote }}
command:
  name: otelcol-contrib
# The preset defines the k8s_attributes processor and its RBAC. The pipelines
# below list it explicitly, AFTER memory_limiter: the preset would otherwise
# put it first, and memory_limiter must run before anything else does work.
presets:
  kubernetesAttributes:
    enabled: true
# Only OTLP is received. The chart's default Jaeger, Zipkin and Prometheus
# receivers are removed, with their Service ports, so nothing listens that no
# pipeline reads.
ports:
  jaeger-compact:
    enabled: false
  jaeger-thrift:
    enabled: false
  jaeger-grpc:
    enabled: false
  zipkin:
    enabled: false
config:
  receivers:
    jaeger: null
    zipkin: null
    prometheus: null
  processors:
    memory_limiter:
      check_interval: 5s
      limit_percentage: 80
      spike_limit_percentage: 25
    batch: {}
    {{- if and $esOn (has "metrics" $esSignals) }}
    cumulativetodelta/histograms:
      include:
        metric_types: [histogram]
    {{- end }}
  exporters:
    {{- if $esOn }}
    elasticsearch:
      endpoints:
        - {{ printf "%s://%s-es-http.%s.svc:9200" (ternary "https" "http" $esTls) $esName $esNs }}
      api_key: ${env:ELASTICSEARCH_API_KEY}
      {{- if $esTls }}
      tls:
        ca_file: /etc/otel/elasticsearch/ca.crt
      {{- end }}
    {{- end }}
    {{- if $apmOn }}
    otlp/apm-server:
      endpoint: {{ printf "apm-server-apm-http.%s.svc:8200" $esNs }}
      tls:
        insecure: true
    {{- end }}
    {{- range $d.otlp }}
    {{ printf "%s/%s" (ternary "otlphttp" "otlp" (eq .protocol "http")) .name }}:
      endpoint: {{ .endpoint }}
      {{- if .insecure }}
      tls:
        insecure: true
      {{- end }}
      {{- with .headers }}
      headers:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    {{- end }}
  service:
    pipelines:
      {{- range $signal := list "traces" "logs" }}
      {{- $exps := get $pipes $signal }}
      {{- if and $esOn (has $signal $esSignals) }}{{- $exps = append $exps "elasticsearch" }}{{- end }}
      {{- if $exps }}
      {{ $signal }}:
        receivers: [otlp]
        processors: [memory_limiter, k8s_attributes, batch]
        exporters: {{ toJson $exps }}
      {{- else }}
      {{ $signal }}: null
      {{- end }}
      {{- end }}
      {{- $mexps := get $pipes "metrics" }}
      {{- if $mexps }}
      metrics:
        receivers: [otlp]
        processors: [memory_limiter, k8s_attributes, batch]
        exporters: {{ toJson $mexps }}
      {{- else }}
      metrics: null
      {{- end }}
      {{- if and $esOn (has "metrics" $esSignals) }}
      metrics/elasticsearch:
        receivers: [otlp]
        processors: [memory_limiter, k8s_attributes, cumulativetodelta/histograms, batch]
        exporters: [elasticsearch]
      {{- end }}
{{- if $esOn }}
# The API key and the cluster CA, written by the elastic-stack setup job
# (templates/elastic-stack/otel-ingest.yaml). Until it has run once the pod
# waits in CreateContainerConfigError, visibly, rather than starting unable to
# authenticate.
extraEnvs:
  - name: ELASTICSEARCH_API_KEY
    valueFrom:
      secretKeyRef:
        name: otel-gateway-elasticsearch
        key: api_key
{{- if $esTls }}
extraVolumes:
  - name: elasticsearch
    secret:
      secretName: otel-gateway-elasticsearch
      items:
        - key: ca.crt
          path: ca.crt
extraVolumeMounts:
  - name: elasticsearch
    mountPath: /etc/otel/elasticsearch
    readOnly: true
{{- end }}
{{- end }}
{{- end -}}
