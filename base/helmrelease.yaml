apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: opsc
  namespace: flux-system
spec:
  interval: 10m
  timeout: 15m
  chart:
    spec:
      chart: ./base/chart
      sourceRef:
        kind: GitRepository
        name: opsc
        namespace: flux-system
  # Wait for resources to be ready, but not for Jobs. The only non-hook Job
  # this chart renders is the Elasticsearch setup for the OpenTelemetry
  # gateway; a failure there must show on that Job, not roll back or
  # uninstall the whole platform (and delete the failed Job's log with it).
  install:
    disableWaitForJobs: true
    remediation:
      retries: 3
  upgrade:
    disableWaitForJobs: true
    cleanupOnFail: true
    remediation:
      retries: 3
      remediateLastFailure: true
  # Values will be patched by overlays
